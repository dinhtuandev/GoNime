<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoNime Manga Viewer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header>
            <h1 id="manga-title">Manga Viewer</h1>
            <div class="controls">
                <button id="prev-btn" onclick="prevPage()">◀ Trước</button>
                <span id="page-info">0 / 0</span>
                <button id="next-btn" onclick="nextPage()">Sau ▶</button>
            </div>
        </header>
        
        <div class="chapter-nav">
            <button onclick="prevChapter()" id="prev-chapter-btn">⏮ Chapter Trước</button>
            <span id="chapter-info">Chapter 1</span>
            <button onclick="nextChapter()" id="next-chapter-btn">Chapter Sau ⏭</button>
        </div>
        
        <main id="viewer-container">
            <div id="loading">Đang tải...</div>
            <img id="manga-image" src="" alt="Manga page" onload="imageLoaded()" onerror="imageError()">
        </main>
        
        <footer>
            <div class="navigation">
                <button onclick="firstPage()">⏮ Đầu</button>
                <button onclick="prevPage()">◀ Trước</button>
                <input type="number" id="page-input" min="1" value="1" onchange="goToPage(this.value)">
                <button onclick="nextPage()">Sau ▶</button>
                <button onclick="lastPage()">⏭ Cuối</button>
            </div>
            <div class="zoom-controls">
                <button onclick="zoomOut()">➖</button>
                <span id="zoom-level">100%</span>
                <button onclick="zoomIn()">➕</button>
                <button onclick="fitToWindow()">Fit</button>
            </div>
        </footer>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
